<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Attendance</title>
  <!-- Library to read Excel files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      background-color: #f4f7f6; 
      margin: 0; 
      padding: 20px; 
    }
    .box { 
      background: white; 
      padding: 30px 20px; 
      width: 100%; 
      max-width: 350px; 
      margin: 50px auto; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      box-sizing: border-box;
    }
    h2 { color: #333; margin-bottom: 20px; }
    input { 
      margin-bottom: 15px; 
      padding: 12px; 
      width: 100%; 
      border: 1.5px solid #ccc; 
      border-radius: 8px; 
      box-sizing: border-box; 
      font-size: 16px; 
    }
    button { 
      padding: 12px; 
      width: 100%; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: bold; 
    }
    button:hover { background: #0056b3; }
    #result { 
      margin-top: 20px; 
      font-weight: bold; 
      font-size: 18px; 
      color: #333; 
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Daily Attendance</h2>
    <input type="text" id="empId" placeholder="Enter Employee ID">
    <button onclick="checkData()">Submit</button>
    <div id="result"></div>
  </div>

  <script>
    async function checkData() {
      let id = document.getElementById('empId').value.trim();
      let resultDiv = document.getElementById('result');

      if(id === "") {
        resultDiv.innerHTML = "<span style='color:red;'>Please enter your Employee ID!</span>";
        return;
      }

      resultDiv.innerHTML = "<span style='color:blue;'>Checking...</span>";

      try {
        // Read the Excel file directly
        let response = await fetch('attendance.xlsx');
        if (!response.ok) throw new Error("File not found");
        
        let arrayBuffer = await response.arrayBuffer();
        let workbook = XLSX.read(arrayBuffer, {type: 'array'});
        
        // Get data from the first sheet
        let firstSheetName = workbook.SheetNames[0];
        let worksheet = workbook.Sheets[firstSheetName];
        let data = XLSX.utils.sheet_to_json(worksheet);

        let found = false;

        for(let i = 0; i < data.length; i++) {
          // Your Excel file must have headers: EmpID, Name, Status
          if(data[i].EmpID != null && String(data[i].EmpID).trim() === id) {
            let empName = data[i].Name || "Employee";
            let empStatus = data[i].Status || "No Status";
            
            resultDiv.innerHTML = "Hello <b>" + empName + "</b>,<br> Today's Status: <span style='color:green;'>" + empStatus + "</span>";
            found = true;
            break;
          }
        }

        if(!found) {
          resultDiv.innerHTML = "<span style='color:red;'>Invalid ID or data not found!</span>";
        }
      } catch (error) {
        resultDiv.innerHTML = "<span style='color:red;'>Attendance data is not updated yet!</span>";
      }
    }
  </script>
</body>
</html>
