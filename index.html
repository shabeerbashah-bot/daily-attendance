<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Attendance Portal</title>
  
  <!-- Modern Font from Google -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Excel Reader Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f4f8;
      color: #333;
      margin: 0;
      padding: 0;
    }
    
    /* Top Navigation Bar */
    .navbar {
      background: #003366;
      color: white;
      padding: 15px 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      letter-spacing: 1px;
    }

    /* Container for Login */
    .login-section {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    .login-box h2 {
      margin-top: 0;
      color: #003366;
      font-weight: 600;
      margin-bottom: 25px;
    }
    .login-box input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      transition: 0.3s;
    }
    .login-box input:focus {
      outline: none;
      border-color: #0056b3;
      box-shadow: 0 0 5px rgba(0, 86, 179, 0.2);
    }
    .login-box button {
      width: 100%;
      padding: 15px;
      background: #0056b3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      font-family: 'Poppins', sans-serif;
    }
    .login-box button:hover {
      background: #004494;
    }
    #loginError {
      color: #dc3545;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Dashboard Section (Hidden by default) */
    .dashboard-section {
      display: none;
      padding: 30px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .profile-card {
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-left: 6px solid #0056b3;
    }
    .profile-info h3 {
      margin: 0;
      color: #333;
      font-size: 22px;
    }
    .profile-info p {
      margin: 5px 0 0 0;
      color: #666;
      font-size: 14px;
    }
    .logout-btn {
      background: #e2e8f0;
      color: #333;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-family: 'Poppins', sans-serif;
    }
    .logout-btn:hover {
      background: #cbd5e1;
    }

    /* Calendar Grid */
    .section-title {
      font-size: 18px;
      color: #4a5568;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }
    .day-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      text-align: center;
      border-bottom: 4px solid #ccc;
      transition: transform 0.2s;
    }
    .day-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .day-card.present { border-bottom-color: #28a745; }
    .day-card.absent { border-bottom-color: #dc3545; }
    
    .day-card .date-text {
      font-size: 13px;
      color: #718096;
      margin-bottom: 8px;
    }
    .day-card .status-text {
      font-size: 18px;
      font-weight: 600;
    }
    .day-card.present .status-text { color: #28a745; }
    .day-card.absent .status-text { color: #dc3545; }

    /* Responsive Design */
    @media (max-width: 600px) {
      .profile-card {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }
      .calendar-grid {
        grid-template-columns: repeat(2, 1fr); /* 2 columns on small mobile */
      }
      .day-card {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    Employee Portal
  </div>

  <!-- Login Area -->
  <div class="login-section" id="loginSection">
    <div class="login-box">
      <h2>Attendance Login</h2>
      <input type="text" id="empId" placeholder="Enter Employee ID">
      <button onclick="login()">View Attendance</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- Dashboard Area -->
  <div class="dashboard-section" id="dashboardSection">
    
    <div class="profile-card">
      <div class="profile-info">
        <h3 id="displayName">Employee Name</h3>
        <p>Employee ID: <span id="displayId">---</span></p>
      </div>
      <button class="logout-btn" onclick="logout()">Logout / Back</button>
    </div>

    <div class="section-title">Attendance Overview</div>
    <div class="calendar-grid" id="calendarGrid">
      <!-- Calendar cards will be generated here by JavaScript -->
    </div>

  </div>

  <script>
    async function login() {
      let id = document.getElementById('empId').value.trim().toUpperCase();
      let errorDiv = document.getElementById('loginError');

      if(id === "") {
        errorDiv.innerHTML = "Please enter your Employee ID.";
        return;
      }

      errorDiv.innerHTML = "<span style='color:#0056b3;'>Authenticating...</span>";

      try {
        let response = await fetch('attendance.xlsx');
        if (!response.ok) throw new Error("Database not found.");
        
        let arrayBuffer = await response.arrayBuffer();
        let workbook = XLSX.read(arrayBuffer, {type: 'array'});
        
        let firstSheetName = workbook.SheetNames[0];
        let worksheet = workbook.Sheets[firstSheetName];
        let data = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        let found = false;
        let record = null;

        for(let i = 0; i < data.length; i++) {
          let rowEmpId = data[i]["User/Employee Id"];
          if(rowEmpId != null && String(rowEmpId).trim().toUpperCase() === id) {
            record = data[i];
            found = true;
            break;
          }
        }

        if(!found) {
          errorDiv.innerHTML = "Invalid ID. Record not found.";
        } else {
          showDashboard(record, id);
        }
      } catch (error) {
        errorDiv.innerHTML = "System error. Data not loaded yet.";
      }
    }

    function showDashboard(record, empId) {
      // Hide login, Show Dashboard
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';

      // Set Profile Details
      document.getElementById('displayName').innerText = record["Display Name"] || "Employee";
      document.getElementById('displayId').innerText = empId;

      // Fixed columns that are not dates
      let ignoreColumns = ["User/Employee Id", "Display Name", "Status", "DOB", "LWD", "Vendor Name"];
      
      let gridHtml = "";
      
      // Loop through all keys (dates) in the record
      for (let key in record) {
        let cleanKey = key.trim();
        // Check if the column is a date column (not in ignore list and not empty)
        if(!ignoreColumns.includes(cleanKey) && !cleanKey.startsWith("__EMPTY")) {
          
          let statusVal = String(record[key]).trim().toUpperCase();
          if(statusVal === "") statusVal = "-";

          let cardClass = "";
          if(statusVal === "PP" || statusVal === "PRESENT" || statusVal === "P") {
            cardClass = "present";
          } else if(statusVal === "AA" || statusVal === "ABSENT" || statusVal === "A") {
            cardClass = "absent";
          }

          gridHtml += `
            <div class="day-card ${cardClass}">
              <div class="date-text">${cleanKey}</div>
              <div class="status-text">${statusVal}</div>
            </div>
          `;
        }
      }

      if(gridHtml === "") {
        gridHtml = "<p style='grid-column: 1 / -1; color: #666;'>No attendance dates recorded yet.</p>";
      }

      document.getElementById('calendarGrid').innerHTML = gridHtml;
    }

    function logout() {
      // Clear input and go back to login screen
      document.getElementById('empId').value = "";
      document.getElementById('loginError').innerHTML = "";
      document.getElementById('dashboardSection').style.display = 'none';
      document.getElementById('loginSection').style.display = 'flex';
    }
  </script>
</body>
</html>
